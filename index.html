<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AI×TikTokアフィリ 10大特典のレビュー用プレビュー">
  <meta name="theme-color" content="#0a0b13">
  <title>AI×TikTokアフィリ｜10大特典レビュー</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230a0b13'/%3E%3Cpath d='M22 15h8v25a8 8 0 1 1-8-8' fill='none' stroke='%232de2e6' stroke-width='6' stroke-linecap='round'/%3E%3Cpath d='M30 16c3 8 9 10 15 10' fill='none' stroke='%23ff3d81' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#top" aria-label="トップへ戻る">
      <span class="brand-mark">AI</span>
      <span>AI×TikTokアフィリ</span>
    </a>
    <span class="review-badge">社内レビュー版 · v0.1</span>
  </header>

  <main id="top">
    <section class="intro" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">10 BONUSES / REVIEW EDITION</p>
        <h1 id="page-title">初成果までをつなぐ<br><span>10大実践特典</span></h1>
      </div>
      <div class="intro-copy">
        <p>ジャンル選定から投稿改善まで、初心者が順番に実践できる構成です。特典を選ぶと本文を確認できます。</p>
        <div class="flow" aria-label="教材の流れ">
          <span><b>01</b>選ぶ</span><i>→</i><span><b>02</b>作る</span><i>→</i><span><b>03</b>届ける</span><i>→</i><span><b>04</b>改善</span>
        </div>
      </div>
    </section>

    <section class="workspace" aria-label="10大特典">
      <nav id="bonus-nav" class="bonus-nav" aria-label="特典一覧">
        <div class="nav-heading">
          <div>
            <p class="section-kicker">CONTENTS</p>
            <h2>特典一覧</h2>
          </div>
          <span class="count">10</span>
        </div>
        <div id="bonus-list" class="bonus-list"></div>
      </nav>

      <article id="reader" class="reader" aria-live="polite">
        <div id="reader-content" class="reader-content">
          <div class="reader-toolbar">
            <button id="back-button" class="text-button" type="button">↑ 特典一覧へ戻る</button>
            <span class="reader-hint">プロンプトは各ボックスからコピーできます</span>
          </div>
          <div id="document" class="document"></div>
          <div class="reader-footer">
            <button id="prev-button" class="pager" type="button">← 前の特典</button>
            <button id="next-button" class="pager" type="button">次の特典 →</button>
          </div>
        </div>
      </article>
    </section>
  </main>

  <footer>
    <p>AI×TikTokアフィリ 10大特典 — Review Draft</p>
    <p>内容・名称・配布形式はレビュー後に確定します。</p>
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="assets/app.js"></script>
</body>
</html>
