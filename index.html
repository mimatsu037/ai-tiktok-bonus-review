<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AI×TikTokアフィリで収益化を目指す人のための10大スタート特典">
  <meta name="theme-color" content="#fffaf7">
  <title>AI×TikTokアフィリ｜収益化を目指す10大特典</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23fff7f4'/%3E%3Cpath d='M22 15h8v25a8 8 0 1 1-8-8' fill='none' stroke='%2369bfc1' stroke-width='6' stroke-linecap='round'/%3E%3Cpath d='M30 16c3 8 9 10 15 10' fill='none' stroke='%23e8807d' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#top" aria-label="トップへ戻る">
      <span class="brand-mark">AI</span>
      <span>AI×TikTokアフィリ</span>
    </a>
  </header>

  <main id="top">
    <section class="intro" aria-labelledby="page-title">
      <div>
        <h1 id="page-title"><span class="title-line">AIを味方に</span><span class="title-line">TikTokアフィリで</span><span class="title-line accent-line">収益化を目指す</span></h1>
      </div>
      <div class="intro-copy">
        <p class="intro-lead">ジャンル・商品選びから、台本・撮影・投稿改善まで。</p>
        <p><span class="phrase-line">AIと実践シートで、最初の投稿を形に。</span><span class="phrase-line">収益につながる土台をつくる10大特典です。</span></p>
      </div>
    </section>

    <section class="workspace" aria-label="10大特典">
      <nav id="bonus-nav" class="bonus-nav" aria-label="特典一覧">
        <div class="nav-heading">
          <div>
            <p class="section-kicker">CONTENTS</p>
            <h2>特典一覧</h2>
          </div>
          <span class="count">10</span>
        </div>
        <div id="bonus-list" class="bonus-list"></div>
      </nav>

      <article id="reader" class="reader" aria-live="polite">
        <div id="reader-content" class="reader-content">
          <div class="reader-toolbar">
            <button id="back-button" class="text-button" type="button">↑ 特典一覧へ戻る</button>
            <span class="reader-hint">AIプロンプト4種＋シート・見本帳・レシピ・行動マップ</span>
          </div>
          <div id="document" class="document"></div>
          <div class="reader-footer">
            <button id="prev-button" class="pager" type="button">← 前の特典</button>
            <button id="next-button" class="pager" type="button">次の特典 →</button>
          </div>
        </div>
      </article>
    </section>
  </main>

  <footer>
    <p>AI×TikTokアフィリ 10大スタート特典</p>
    <p>気になる特典を1つ選び、今日の一歩から始めましょう。</p>
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="assets/app.js"></script>
</body>
</html>
